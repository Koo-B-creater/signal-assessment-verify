<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>和文モールス再生精度 計測専用</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101820; color: #f4f6f7; }
    body { max-width: 64rem; margin: 0 auto; padding: 1.25rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; }
    .notice { border: 2px solid #f5c542; padding: .75rem; border-radius: .5rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1.25rem 0; }
    label { display: inline-flex; gap: .4rem; align-items: center; }
    input, select, button { font: inherit; padding: .3rem .5rem; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #lamp { width: min(38vw, 12rem); height: min(38vw, 12rem); margin: 2rem auto; border: .4rem solid #78838c; border-radius: 50%; background: #202a33; }
    #lamp.on { background: #fff; border-color: #fff; }
    pre { overflow: auto; max-height: 24rem; background: #202a33; padding: 1rem; }
  </style>
</head>
<body>
  <h1>和文モールス再生精度の計測</h1>
  <p class="notice">これは計測のための道具であり、信号査定アプリではありません。点滅する光を表示します。結果は端末でJSONとして保存され、サーバーへ送信しません。学習session・解答・成績・利用者データは作りません。アプリ全体のINV-05やATの合格判定には使いません。</p>
  <p>記録する切替時刻はDOMを書き換えた直後の値です。画面に実際に描画される時刻は測っていません。通常の描画ではさらに約1フレーム遅れる場合があります。</p>
  <p id="environment"></p>
  <p id="status" role="status">教材を確認しています。</p>
  <div class="controls">
    <label>u（ms）<input id="u" type="number" min="50" max="300" value="50"></label>
    <label>前置き（ms）<input id="gap" type="number" min="1000" max="5000" value="1000"></label>
    <label>文字<select id="character"></select></label>
    <label><input id="ack" type="checkbox">点滅の注意を確認した</label>
  </div>
  <div class="controls">
    <button id="single" disabled>選択文字を1回計測</button>
    <button id="representatives" disabled>代表4字を各20回計測</button>
    <button id="five-elements" disabled>5要素31字を各1回計測</button>
    <button id="stop" disabled>停止</button>
  </div>
  <div id="lamp" aria-label="消灯"></div>
  <div class="controls">
    <label>ソースcommit <input id="source-commit" type="text" placeholder="登録後のcommit SHA"></label>
    <label>端末名 <input id="device-label" type="text" placeholder="例：iPhone、Windows PC"></label>
    <label>判定者 <input id="judge" type="text"></label>
    <button id="download" disabled>JSON記録を保存</button>
  </div>
  <pre id="summary"></pre>
  <script type="module" src="./main.js"></script>
</body>
</html>
